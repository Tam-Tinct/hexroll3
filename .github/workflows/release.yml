name: release

on:
  push:
    tags:
      - "github*"
  workflow_dispatch:

jobs:
  windows-msvc:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Swatinem/rust-cache@v1

      - name: Install ARM64 Rust target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build (MSVC) for ARM64
        run: cargo build --release --package hexroll3-app --target aarch64-pc-windows-msvc

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexroll3-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/hexroll3-app.exe
